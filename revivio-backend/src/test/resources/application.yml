server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:revivio_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    secret: revivio-test-secret-key-must-be-min-256-bits-long-for-valid-hmac-sha-signing
    expiration: 3600000

  storage:
    location: ./target/test-uploads
